version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ansin
      POSTGRES_USER: ansin
      POSTGRES_PASSWORD: ansin_dev
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ansin"]
      interval: 5s
      retries: 10

volumes:
  postgres_data:
